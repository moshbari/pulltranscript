<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="360" rx="16" fill="#0f1117"/>
  <rect x="1" y="1" width="758" height="358" rx="16" fill="none" stroke="#2a2f3a" stroke-width="1"/>

  <!-- zip file -->
  <g transform="translate(70,110)">
    <rect x="0" y="0" width="150" height="170" rx="12" fill="#e9eef5"/>
    <rect x="62" y="-6" width="26" height="120" rx="4" fill="#c4ccd8"/>
    <rect x="68" y="6" width="14" height="14" rx="2" fill="#9aa6b6"/>
    <rect x="68" y="30" width="14" height="14" rx="2" fill="#9aa6b6"/>
    <rect x="68" y="54" width="14" height="14" rx="2" fill="#9aa6b6"/>
    <text x="75" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#3b4250">ZIP</text>
  </g>
  <text x="145" y="312" text-anchor="middle" font-size="16" fill="#aeb6c2">youtube-transcript-extension.zip</text>

  <!-- arrow -->
  <g stroke="#f97316" stroke-width="6" fill="none">
    <line x1="270" y1="195" x2="430" y2="195"/>
  </g>
  <polygon points="430,178 462,195 430,212" fill="#f97316"/>
  <text x="366" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#f97316">double-click</text>

  <!-- folder -->
  <g transform="translate(500,108)">
    <path d="M6 26 q0 -14 14 -14 h44 l16 16 h70 q14 0 14 14 v118 q0 14 -14 14 H20 q-14 0 -14 -14 Z" fill="#5b8def"/>
    <path d="M6 52 h168 v92 q0 14 -14 14 H20 q-14 0 -14 -14 Z" fill="#7ba6f5"/>
    <text x="90" y="186" text-anchor="middle" font-size="16" fill="#aeb6c2">a folder</text>
  </g>

  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Unzip the file you downloaded</text>
</svg>
