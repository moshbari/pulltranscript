<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="420" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="419" rx="14" fill="none" stroke="#d9dee6"/>

  <!-- browser toolbar -->
  <rect x="0" y="0" width="760" height="56" rx="14" fill="#f1f3f4"/>
  <rect x="0" y="40" width="760" height="16" fill="#f1f3f4"/>
  <circle cx="26" cy="28" r="6" fill="#ed6a5e"/>
  <circle cx="46" cy="28" r="6" fill="#f4bf4f"/>
  <circle cx="66" cy="28" r="6" fill="#61c554"/>
  <rect x="96" y="14" width="560" height="28" rx="14" fill="#ffffff" stroke="#d9dee6"/>
  <text x="116" y="33" font-size="15" fill="#5f6368">chrome://extensions</text>

  <text x="32" y="100" font-size="22" font-weight="700" fill="#202124">Extensions</text>

  <!-- Load unpacked button highlighted -->
  <rect x="32" y="124" width="160" height="44" rx="22" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="112" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">Load unpacked</text>
  <rect x="24" y="116" width="176" height="60" rx="14" fill="none" stroke="#f97316" stroke-width="4"/>
  <g>
    <rect x="60" y="186" width="220" height="44" rx="10" fill="#f97316"/>
    <text x="170" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2. Click “Load unpacked”</text>
    <polygon points="150,186 162,186 156,174" fill="#f97316"/>
  </g>

  <!-- file picker dialog -->
  <g>
    <rect x="300" y="120" width="420" height="250" rx="12" fill="#f8f9fb" stroke="#d9dee6"/>
    <rect x="300" y="120" width="420" height="40" rx="12" fill="#eceff3"/>
    <text x="320" y="145" font-size="15" font-weight="600" fill="#3c4043">Select the extension folder</text>

    <!-- highlighted folder row -->
    <rect x="316" y="176" width="388" height="40" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <path d="M332 188 q0 -4 4 -4 h12 l5 5 h20 q4 0 4 4 v14 q0 4 -4 4 h-37 q-4 0 -4 -4 Z" fill="#5b8def"/>
    <text x="392" y="201" font-size="15" font-weight="600" fill="#1a3a7a">youtube-transcript-extension</text>

    <!-- other rows -->
    <path d="M332 234 q0 -4 4 -4 h12 l5 5 h20 q4 0 4 4 v14 q0 4 -4 4 h-37 q-4 0 -4 -4 Z" fill="#c4ccd8"/>
    <text x="392" y="247" font-size="15" fill="#9aa0a6">Documents</text>
    <path d="M332 270 q0 -4 4 -4 h12 l5 5 h20 q4 0 4 4 v14 q0 4 -4 4 h-37 q-4 0 -4 -4 Z" fill="#c4ccd8"/>
    <text x="392" y="283" font-size="15" fill="#9aa0a6">Downloads</text>

    <!-- buttons -->
    <rect x="498" y="320" width="92" height="34" rx="8" fill="#ffffff" stroke="#d9dee6"/>
    <text x="544" y="342" text-anchor="middle" font-size="14" fill="#5f6368">Cancel</text>
    <rect x="604" y="320" width="100" height="34" rx="8" fill="#1a73e8"/>
    <text x="654" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Select</text>
    <rect x="596" y="312" width="116" height="50" rx="11" fill="none" stroke="#f97316" stroke-width="4"/>
  </g>
  <text x="510" y="398" text-anchor="middle" font-size="15" fill="#5f6368">3. Pick the unzipped folder, then click <tspan font-weight="700" fill="#202124">Select</tspan>.</text>
</svg>
