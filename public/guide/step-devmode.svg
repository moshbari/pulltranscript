<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="420" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="419" rx="14" fill="none" stroke="#d9dee6"/>

  <!-- browser toolbar -->
  <rect x="0" y="0" width="760" height="56" rx="14" fill="#f1f3f4"/>
  <rect x="0" y="40" width="760" height="16" fill="#f1f3f4"/>
  <circle cx="26" cy="28" r="6" fill="#ed6a5e"/>
  <circle cx="46" cy="28" r="6" fill="#f4bf4f"/>
  <circle cx="66" cy="28" r="6" fill="#61c554"/>
  <rect x="96" y="14" width="560" height="28" rx="14" fill="#ffffff" stroke="#d9dee6"/>
  <text x="116" y="33" font-size="15" fill="#5f6368">chrome://extensions</text>

  <!-- page header -->
  <text x="32" y="104" font-size="22" font-weight="700" fill="#202124">Extensions</text>

  <!-- developer mode toggle (ON) -->
  <text x="556" y="104" text-anchor="end" font-size="16" fill="#202124">Developer mode</text>
  <rect x="572" y="89" width="46" height="22" rx="11" fill="#1a73e8"/>
  <circle cx="607" cy="100" r="9" fill="#ffffff"/>

  <!-- highlight ring around toggle -->
  <rect x="468" y="80" width="166" height="40" rx="12" fill="none" stroke="#f97316" stroke-width="4"/>
  <!-- callout -->
  <g>
    <rect x="486" y="140" width="240" height="44" rx="10" fill="#f97316"/>
    <text x="606" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1. Turn this switch ON</text>
    <polygon points="600,140 612,140 606,128" fill="#f97316"/>
  </g>

  <!-- toolbar that appears after dev mode: buttons -->
  <rect x="32" y="210" width="150" height="40" rx="20" fill="#ffffff" stroke="#1a73e8"/>
  <text x="107" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#1a73e8">Load unpacked</text>
  <rect x="196" y="210" width="150" height="40" rx="20" fill="#ffffff" stroke="#d9dee6"/>
  <text x="271" y="235" text-anchor="middle" font-size="15" fill="#9aa0a6">Pack extension</text>
  <rect x="360" y="210" width="100" height="40" rx="20" fill="#ffffff" stroke="#d9dee6"/>
  <text x="410" y="235" text-anchor="middle" font-size="15" fill="#9aa0a6">Update</text>

  <!-- empty state hint -->
  <text x="380" y="330" text-anchor="middle" font-size="15" fill="#9aa0a6">After turning Developer mode on, these buttons appear.</text>
  <text x="380" y="356" text-anchor="middle" font-size="15" fill="#9aa0a6">You'll click “Load unpacked” in the next step.</text>
</svg>
